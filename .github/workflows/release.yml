name: Release

# 先提交版本号和 Changelog，再给该提交打 tag。安装包从 tag 构建，上传后才提交 appcast。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 tag 源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source
      - name: 检出默认分支元数据
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: metadata
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 读取版本号
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须形如 v1.4.0，收到 $TAG_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: 校验 tag 已包含在默认分支里
        working-directory: source
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"
      - name: 检查生成文件
        working-directory: source
        run: python3 scripts/generate_catalog.py --check
      - name: 回归测试
        working-directory: source
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: 发布前核对实时模型目录
        working-directory: source
        run: python3 scripts/check_catalog.py
      - name: 从 tag 打包并生成固定版本记录
        working-directory: source
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release.py --version "$VERSION" --repo "$REPOSITORY" --no-appcast
      - name: 上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.meta.outputs.version }}
          files: source/dist/*.bobplugin
          body_path: source/dist/release-notes.md
          fail_on_unmatched_files: true
      - name: 将 appcast 合并到最新默认分支
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 source/scripts/publish_appcast.py \
            --entry-file source/dist/appcast-entry.json \
            --repo-root metadata \
            --branch "$BRANCH" \
            --max-attempts 3
